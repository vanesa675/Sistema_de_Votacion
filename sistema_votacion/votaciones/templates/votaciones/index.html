{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Votación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{% static 'img/logo.jpeg' %}">
</head>

<body class="relative flex items-center justify-center min-h-screen bg-gray-100">

<div class="absolute inset-0 bg-cover bg-center"
     style="background-image: url('{% static 'img/banner.jpeg' %}');">
    <div class="absolute inset-0 bg-black bg-opacity-40 backdrop-blur-md"></div>
</div>

<div class="relative w-full max-w-4xl p-8 bg-white bg-opacity-70 rounded-lg">

<h1 class="text-3xl font-bold text-center mb-6">Votaciones Personería</h1>

<form method="POST">
{% csrf_token %}

<!-- Grado / Mesa / Nombre -->
<div class="grid grid-cols-3 gap-4 mb-6">
    <!-- grado -->
    <select name="grado" required>
        <option value="">Seleccione grado</option>
        {% for grado in grados %}
            <option value="{{ grado.id }}">{{ grado.nombre }}</option>
        {% endfor %}
    </select>

    <!-- mesa -->
    <select name="mesa" required>
        <option value="">Seleccione mesa</option>
        {% for mesa in mesas %}
            <option value="{{ mesa.id }}">{{ mesa.nombre }}</option>
        {% endfor %}
    </select>

    <input type="text" name="nombre" placeholder="Nombre" required>
</div>

<!-- 🔥 CANDIDATOS -->
<div class="flex flex-wrap justify-center gap-6">

{% for candidato in candidatos %}
    <label class="cursor-pointer">
        <input type="radio"
               name="candidato"
               value="{{ candidato.id }}"
               class="hidden peer"
               required>

        <div class="w-64 p-4 bg-white rounded-lg shadow-md text-center 
                    transition transform hover:scale-105
                    peer-checked:ring-4 peer-checked:ring-blue-500">

            <img src="{{ candidato.imagen.url }}"
                 class="w-40 h-40 object-cover mx-auto rounded-lg mb-3">

            <p class="font-bold text-lg">Tarjetón #{{ candidato.tarjeton }}</p>
            <p class="text-gray-700">{{ candidato.nombre }}</p>

        </div>
    </label>
{% endfor %}

</div>


<button class="mt-6 w-full bg-blue-600 text-white py-3 rounded">
    Votar
</button>

</form>
</div>
</body>
</html>
