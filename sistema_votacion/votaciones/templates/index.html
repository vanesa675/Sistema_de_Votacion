{% load static %}
{% for candidato in candidatos %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Votación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{% static 'img/logo.jpeg' %}" type="image/x-icon">
</head>
<body class="relative flex flex-col items-center justify-center min-h-screen bg-gray-100">
    
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('{% static 'img/banner.jpeg' %}');">
        <div class="absolute inset-0 bg-black bg-opacity-40 backdrop-blur-md"></div>
    </div>

    <div class="relative w-full max-w-4xl p-8 bg-white bg-opacity-70 backdrop-blur-md shadow-lg rounded-lg text-center">
        <img src="{% static 'img/logo.png' %}" alt="Logo del Colegio" class="w-24 mx-auto mb-4 bg-transparent">
        <h1 class="text-3xl font-bold text-gray-800">Votaciones Personería 2025</h1>

        <!-- 🔹 Mensajes de éxito o error después de votar -->
        {% if messages %}
    <div id="message-container" class="fixed inset-0 flex items-center justify-center z-50">
        <div class="p-6 rounded-lg text-white shadow-lg text-center transition-opacity duration-1000 opacity-100
            {% for message in messages %} 
                {% if message.tags == 'success' %} bg-green-500 
                {% elif message.tags == 'error' %} bg-red-500 
                {% endif %}
            {% endfor %}">
            {% for message in messages %}
                <p class="text-lg font-semibold">{{ message }}</p>
            {% endfor %}
        </div>
    </div>

    <script>
        setTimeout(function() {
            var messageContainer = document.getElementById("message-container");
            if (messageContainer) {
                messageContainer.style.transition = "opacity 1s ease-out"; 
                messageContainer.style.opacity = "0";  
                setTimeout(function() { 
                    messageContainer.style.display = "none"; 
                }, 1000); // Espera 1s después de la transición
            }
        }, 3000); // Mensaje visible por 3 segundos antes de desvanecerse
    </script>
{% endif %}

        <form method="POST" action="{% url 'index' %}">
            {% csrf_token %}
            <div class="flex w-full max-w-4xl my-6 mx-auto gap-4">
    
                <!-- Campo Grado -->
                <div class="w-1/3">
                    <label class="block text-gray-700 font-semibold text-lg mb-2">Grado:</label>
                    <select name="grado" class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="" disabled selected hidden>Seleccione su grado</option>
                        {% for grado in grados %}
                            <option value="{{ grado.id }}">{{ grado.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            
                <!-- Campo Mesa -->
                <div class="w-1/3">
                    <label class="block text-gray-700 font-semibold text-lg mb-2">Mesa:</label>
                    <select name="mesa" class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="" disabled selected hidden>Seleccione su mesa</option>
                        {% for mesa in mesas %}
                            <option value="{{ mesa.id }}">{{ mesa.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            
                <!-- Campo Nombre -->
                <div class="w-1/3">
                    <label class="block text-gray-700 font-semibold text-lg mb-2">Nombre:</label>
                    <input type="text" name="nombre" class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Ingrese su nombre" required>
                </div>
            
            </div>
            
        
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-4xl">
                <label class="cursor-pointer">
                    <input type="radio" name="candidato" value="1" class="hidden peer" required>
                    <div class="bg-white rounded-lg shadow-lg hover:shadow-xl transition p-4 text-center peer-checked:ring-2 peer-checked:ring-blue-500">
                        <img src="{% static 'img/Daniel.jpeg' %}" alt="Candidato 1" class="w-full rounded-lg mb-2 transform transition hover:scale-105">
                        
                        <!-- Tarjetón con icono -->
                        <div class="flex items-center justify-center space-x-2">
                            <img src="{% static 'img/chimuelo1.jpg' %}" alt="Tarjetón" class="w-5 h-5 rounded-full border border-gray-300">
                            <p class="text-lg font-semibold">Tarjetón #{{ candidato.tarjeton }}</p>
                        </div>
            
                        <p class="text-xl font-semibold text-gray-800">{{ candidato.nombre }}</p>
                    </div>
                </label>
                
                <label class="cursor-pointer">
                    <input type="radio" name="candidato" value="2" class="hidden peer">
                    <div class="bg-white rounded-lg shadow-lg hover:shadow-xl transition p-4 text-center peer-checked:ring-2 peer-checked:ring-blue-500">
                        <img src="{% static 'img/Angela.jpeg' %}" alt="Candidato 2" class="w-full rounded-lg mb-2 transform transition hover:scale-105">
                        
                        <!-- Tarjetón con icono -->
                        <div class="flex items-center justify-center space-x-2">
                            <img src="{% static 'img/osicari.jpg' %}" alt="Tarjetón" class="w-5 h-5 rounded-full border border-gray-300">
                            <p class="text-lg font-semibold">Tarjetón #{{ candidato.tarjeton }}</p>
                        </div>
            
                        <p class="text-xl font-semibold text-gray-800">{{ candidato.nombre }}</p>
                    </div>
                </label>
                
                <label class="cursor-pointer">
                    <input type="radio" name="candidato" value="3" class="hidden peer">
                    <div class="bg-white rounded-lg shadow-lg hover:shadow-xl transition p-4 text-center peer-checked:ring-2 peer-checked:ring-blue-500">
                        <img src="{% static 'img/perfil.png' %}" alt="Candidato 3" class="w-full rounded-lg mb-2 transform transition hover:scale-105">
                        
                        <!-- Voto en blanco SIN icono -->
                        <p class="text-lg font-semibold">Voto en blanco</p>
            
                        <p class="text-xl font-semibold text-gray-800">{{ candidato.nombre }}</p>
                    </div>
                </label>
            </div>
            {% endfor %}
        
            <div class="w-full flex justify-center mt-6">
                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">
                    Votar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
